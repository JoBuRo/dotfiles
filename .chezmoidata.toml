[profiles.default]

[profiles.default.shell]
plugins = [
  "git",
  "archlinux",
  "dotenv",
  "docker",
  "sudo",
  "tmux",
  "python",
  "systemd",
  "history",
  "zoxide",
]
pathAdd = ["go/bin", ".cargo/bin"]
theme = "onedark"

[profiles.default.features]
agents = true
gui = true
server = false

[profiles.default.dependencies]
commands = [
  "git",
  "zsh",
  "nvim",
  "tmux",
  "btm",
  "yazi",
  "fc-match",
  "docker",
  "sudo",
  "python3",
  "systemctl",
  "zoxide",
  "starship",
  "lsd",
  "wl-copy",
  "wl-paste",
  "rg",
  "fd",
  "go",
  "cargo",
]
fonts = ["FiraCode Nerd Font"]

[profiles.default.dependencies.byFeature.agents]
commands = ["opencode"]

[profiles.default.dependencies.byFeature.agents.packages]
arch = ["opencode"]

[profiles.default.dependencies.byFeature.gui]
commands = ["kitty"]

[profiles.default.dependencies.byFeature.gui.packages]
arch = ["kitty"]

[profiles.default.dependencies.packages]
arch = [
  "git",
  "zsh",
  "neovim",
  "tmux",
  "bottom",
  "yazi",
  "fontconfig",
  "ttf-firacode-nerd",
  "docker",
  "sudo",
  "python",
  "systemd",
  "zoxide",
  "starship",
  "lsd",
  "wl-clipboard",
  "ripgrep",
  "fd",
  "go",
  "rust",
]

